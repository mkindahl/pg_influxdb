name: Release

# Action references are pinned to commit hashes to guard against supply-chain
# attacks where a mutable tag is silently moved to a malicious commit.
# To look up the hash for a version tag, run:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  validate-version:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for gh release create
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Prevent git credentials from being written to disk; no git
          # operations requiring authentication are performed after checkout.
          persist-credentials: false

      - name: Check tag matches extension version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(perl -ne 'print "$1" if /^default_version\s*=\s*'\''(\d+\.\d+)'\''/' influxdb.control)
          if [ -z "$version" ]; then
            echo "::error::Could not extract version from influxdb.control"
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match extension version ${version} in influxdb.control"
            exit 1
          fi
          echo "Tag v${tag} matches extension version ${version}"

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
