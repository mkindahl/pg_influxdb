name: Copyright Check

# Action references are pinned to commit hashes to guard against supply-chain
# attacks where a mutable tag is silently moved to a malicious commit.
# To look up the hash for a version tag, run:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  copyright:
    name: Check Copyright Notices
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Prevent git credentials from being written to disk; no git
          # operations requiring authentication are performed after checkout.
          persist-credentials: false

      - name: Check for copyright notices
        run: |
          status=0
          while IFS= read -r file; do
            if ! head -5 "$file" | grep -qP '^\s*([#*]|--)\s*Copyright \(C\) \d{4}([,\-]\d{4})* Mats Kindahl'; then
              echo "::error file=$file::Missing or malformed copyright notice"
              status=1
            fi
          done < <(find src -name '*.c' -o -name '*.h' -o -name '*.y' -o -name '*.l' \
            | grep -v -e http_parser.c -e http_parser.h \
                      -e query_parser.c -e query_parser.h \
                      -e query_scanner.c -e query_scanner.h \
                      -e tokenizer_lex.c -e tokenizer_lex.h
            find t -name '*.pl'
            find perl -name '*.pm'
            find sql -name '*.sql'
            echo Makefile
            echo influxdb.sql)
          exit $status
