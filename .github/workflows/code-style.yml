name: Code Style Check

# Action references are pinned to commit hashes to guard against supply-chain
# attacks where a mutable tag is silently moved to a malicious commit.
# To look up the hash for a version tag, run:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  perltidy:
    name: Check Perl Code Style with perltidy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Prevent git credentials from being written to disk; no git
          # operations requiring authentication are performed after checkout.
          persist-credentials: false
      - name: Install perltidy
        run: sudo apt-get update && sudo apt-get install -y perltidy
      - name: Compare perltidy formatting options
        run: diff <(perltidy -dop) .github/perltidy-options.txt
      - name: Show perl files
        run: find . -name '*.p[lm]' -ls
      - name: Run perltidy
        run: make format-perl
      - name: Check for formatting differences
        run: git diff --exit-code

  clang-format:
    name: Check C Code Style with clang-format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Prevent git credentials from being written to disk; no git
          # operations requiring authentication are performed after checkout.
          persist-credentials: false
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Run clang-format
        run: make format-clang
      - name: Check for formatting differences
        run: git diff --exit-code
