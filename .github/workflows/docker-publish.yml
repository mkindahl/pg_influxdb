name: Docker Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY_IMAGE: mkindahl/pg_influxdb

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: [17, 18]
        variant: [bookworm, bullseye, trixie, alpine]
        exclude:
          - pg_version: 18
            variant: bullseye

    name: Publish PG ${{ matrix.pg_version }} / ${{ matrix.variant }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(perl -ne 'print "$1" if /^default_version.*(\d+\.\d+)/' influxdb.control)
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-pg${{ matrix.pg_version }}-${{ matrix.variant }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          build-args: PG_MAJOR=${{ matrix.pg_version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag-aliases:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(perl -ne 'print "$1" if /^default_version.*(\d+\.\d+)/' influxdb.control)
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag convenience aliases
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # latest → newest version, PG 18, bookworm
          docker buildx imagetools create -t "$REGISTRY_IMAGE:latest" \
            "$REGISTRY_IMAGE:${VERSION}-pg18-bookworm"

          # pgXX → latest version on PG XX, bookworm
          docker buildx imagetools create -t "$REGISTRY_IMAGE:pg18" \
            "$REGISTRY_IMAGE:${VERSION}-pg18-bookworm"

          docker buildx imagetools create -t "$REGISTRY_IMAGE:pg17" \
            "$REGISTRY_IMAGE:${VERSION}-pg17-bookworm"
