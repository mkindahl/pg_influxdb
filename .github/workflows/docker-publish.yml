name: Docker Publish

# Action references are pinned to commit hashes to guard against supply-chain
# attacks where a mutable tag is silently moved to a malicious commit.
# To look up the hash for a version tag, run:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'

on:
  # workflow_run is safe here: the upstream "Release" workflow only fires on
  # push:tags, which requires write access to the repo, so fork PRs cannot
  # trigger it and thereby reach this workflow's secrets.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY_IMAGE: mkindahl/pg_influxdb

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: [17, 18]
        variant: [bookworm, bullseye, trixie, alpine]
        exclude:
          - pg_version: 18
            variant: bullseye

    name: Publish PG ${{ matrix.pg_version }} / ${{ matrix.variant }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Prevent git credentials from being written to disk; no git
          # operations requiring authentication are performed after checkout.
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: |
          version=$(perl -ne 'print "$1" if /^default_version.*(\d+\.\d+)/' influxdb.control)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-pg${{ matrix.pg_version }}-${{ matrix.variant }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          build-args: PG_MAJOR=${{ matrix.pg_version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag-aliases:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Prevent git credentials from being written to disk; no git
          # operations requiring authentication are performed after checkout.
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: |
          version=$(perl -ne 'print "$1" if /^default_version.*(\d+\.\d+)/' influxdb.control)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Tag convenience aliases
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # latest → newest version, PG 18, bookworm
          docker buildx imagetools create -t "$REGISTRY_IMAGE:latest" \
            "$REGISTRY_IMAGE:${VERSION}-pg18-bookworm"

          # pgXX → latest version on PG XX, bookworm
          docker buildx imagetools create -t "$REGISTRY_IMAGE:pg18" \
            "$REGISTRY_IMAGE:${VERSION}-pg18-bookworm"

          docker buildx imagetools create -t "$REGISTRY_IMAGE:pg17" \
            "$REGISTRY_IMAGE:${VERSION}-pg17-bookworm"
